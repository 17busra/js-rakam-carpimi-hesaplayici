     
<!DOCTYPE html>
<html>
  <head>
    <title>1</title>
  </head>
  <body>
    <script type="text/javascript">
      var x = prompt("Enter an integer to find the product of its digits: ");
      a = parseInt(x);
      while(isNaN(x)){
        x = prompt(x+" is not a number. Try again (enter a number): ");
        a = parseInt(x)
      }
      var output = "The product of digits of " + a + " is: ";
      var product = 1;
      if (a==0){
        product = 0
        output += 0;
        
      }else{
      while(a!=0){
        rem = Math.floor(a%10);
        product *= rem;
        a=Math.floor(a/10);
        if(a!=0)
          output += rem+"*" ;
        else
          output += rem;
      }}
      document.write(output+" = "+product);
    </script>
  </body>
</html>
